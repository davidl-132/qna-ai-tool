<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Highlight AI – Cài đặt</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #1f2937; }
    h1 { font-size: 20px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    h2 { font-size: 16px; margin-top: 32px; }
    textarea { font-family: inherit; resize: vertical; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
    .hint { color: #6b7280; font-size: 12px; margin-top: 4px; }
    .row { display: flex; gap: 8px; margin-top: 20px; }
    button { padding: 8px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: #e5e7eb; color: #111827; }
    #status { margin-top: 12px; min-height: 20px; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
    .item { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
    .item .meta { color: #6b7280; font-size: 12px; }
    .item .sel { color: #374151; border-left: 3px solid #2563eb; padding-left: 8px; margin: 6px 0; font-size: 13px; }
    .item .ans { white-space: pre-wrap; font-size: 13px; max-height: 160px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Highlight AI – Cài đặt</h1>

  <label for="serverUrl">Địa chỉ server</label>
  <input id="serverUrl" placeholder="http://127.0.0.1:8765">

  <label for="token">Token (LOCAL_TOKEN)</label>
  <input id="token" type="password" placeholder="Dán token server in ra khi chạy python -m api.main">
  <div class="hint">Token cũng nằm trong file <code>.env</code> của dự án Python.</div>

  <label for="mode">Chế độ mặc định</label>
  <select id="mode">
    <option value="explain">Giải thích</option>
    <option value="translate">Dịch</option>
    <option value="summarize">Tóm tắt</option>
    <option value="answer">Trả lời / giải bài</option>
  </select>

  <label for="lang">Ngôn ngữ trả lời</label>
  <select id="lang">
    <option value="vi">Tiếng Việt</option>
    <option value="en">English</option>
  </select>

  <label for="excludedSites">Không hiện nút trên các trang</label>
  <textarea id="excludedSites" rows="3" placeholder="mỗi dòng một tên miền, ví dụ:&#10;vietcombank.com.vn&#10;mail.google.com"></textarea>
  <div class="hint">Gợi ý: trang ngân hàng, email, tài liệu mật. Chuột phải "Hỏi AI" vẫn dùng được.</div>

  <div class="row">
    <button id="save">Lưu</button>
    <button id="test" class="secondary">Kiểm tra kết nối</button>
  </div>
  <div id="status"></div>

  <h2>Lịch sử gần đây</h2>
  <div class="row" style="margin-top:0">
    <button id="loadHistory" class="secondary">Tải lịch sử</button>
    <button id="clearHistory" class="secondary">Xoá toàn bộ</button>
  </div>
  <div id="history"></div>

  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
